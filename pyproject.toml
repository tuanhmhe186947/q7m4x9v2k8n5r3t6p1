[project]
name = "pig-behavior-classification"
version = "0.1.0"
description = "Training, export, and inference pipeline for pig behavior classification."
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "tensorflow>=2.12",
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "Pillow>=9.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
pig-behavior = "pig_behavior.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8",
]
notebooks = [
    "ipykernel>=6",
    "jupyterlab>=4",
]
onnx = [
    "onnx>=1.15",
    "tf2onnx>=1.16",
]
tracking = [
    "opencv-python-headless>=4.8",
    "scipy>=1.10",
    "tqdm>=4.66",
    "ultralytics>=8.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
