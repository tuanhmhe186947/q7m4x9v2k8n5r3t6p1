[project]
name = "pig-behavior-classification"
version = "0.1.0"
description = "Training, export, and inference pipeline for pig behavior classification."
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "fastapi>=0.115",
    "tensorflow>=2.12",
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "Pillow>=9.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "inference-sdk>=0.9.18",
    "backoff>=2.2.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
pig-behavior = "pig_behavior.cli:main"
pig-behavior-api = "pig_behavior.api:run"
pig-build-classification-data = "pig_behavior.data_preparation.classification_dataset:main"
pig-track-for-annotation = "pig_behavior.tracking.cli:main"
pig-tracking-eval = "pig_behavior.evaluation.tracking_pipeline:main"

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7",
    "ruff>=0.4",
    "pytest>=8",
]
notebooks = [
    "ipykernel>=6",
    "jupyterlab>=4",
]
onnx = [
    "onnx>=1.15",
    "tf2onnx>=1.16",
]
pt = [
    "opencv-python-headless>=4.8",
    "torch>=2.1",
    "torchvision>=0.16",
    "ultralytics>=8.3",
]
tracking = [
    "opencv-python-headless>=4.8",
    "scipy>=1.10",
    "tqdm>=4.66",
    "ultralytics>=8.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src"]
exclude = [
    "scripts/connect_gdrive.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
