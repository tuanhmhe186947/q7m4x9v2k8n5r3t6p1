<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="100%" height="100%">
  <defs>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .bold-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
      .val-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
      .chart-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .grid { stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 2,2; }
      .axis { stroke: #94a3b8; stroke-width: 1.2; }
      .error-bar { stroke: #1e293b; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="700" height="320" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1"/>

  <g transform="translate(30, 20)">
    <text class="chart-title" x="0" y="15">Behavior Recognition 5-Fold Cross-Validation (Mean Macro-F1 ± Sample SD)</text>

    <!-- Y-axis 0.0 to 1.0 (Full Axis, 200px range, y=50 is 1.0, y=250 is 0.0) -->
    <line class="grid" x1="45" y1="50" x2="620" y2="50"/>
    <text class="label" x="40" y="54" text-anchor="end">1.0</text>

    <line class="grid" x1="45" y1="90" x2="620" y2="90"/>
    <text class="label" x="40" y="94" text-anchor="end">0.8</text>

    <line class="grid" x1="45" y1="130" x2="620" y2="130"/>
    <text class="label" x="40" y="134" text-anchor="end">0.6</text>

    <line class="grid" x1="45" y1="170" x2="620" y2="170"/>
    <text class="label" x="40" y="174" text-anchor="end">0.4</text>

    <line class="grid" x1="45" y1="210" x2="620" y2="210"/>
    <text class="label" x="40" y="214" text-anchor="end">0.2</text>

    <line class="axis" x1="45" y1="250" x2="620" y2="250"/>
    <text class="label" x="40" y="254" text-anchor="end">0.0</text>
    <line class="axis" x1="45" y1="50" x2="45" y2="250"/>

    <!-- Bar 1: Model A (Mean: 0.6778, SD: 0.0268) -->
    <!-- y = 250 - 0.6778 * 200 = 250 - 135.56 = 114.44; height = 135.56 -->
    <!-- err_top = 250 - (0.6778+0.0268)*200 = 250 - 140.92 = 109.08 -->
    <!-- err_bot = 250 - (0.6778-0.0268)*200 = 250 - 130.20 = 119.80 -->
    <rect x="80" y="114.4" width="60" height="135.6" fill="#94a3b8" rx="4"/>
    <line class="error-bar" x1="110" y1="109.1" x2="110" y2="119.8"/>
    <line class="error-bar" x1="104" y1="109.1" x2="116" y2="109.1"/>
    <line class="error-bar" x1="104" y1="119.8" x2="116" y2="119.8"/>
    <text class="val-label" x="110" y="100">0.6778</text>
    <text class="bold-label" x="110" y="270">Model A</text>
    <text class="label" x="110" y="285" text-anchor="middle">Baseline</text>

    <!-- Bar 2: Model B (Mean: 0.6708, SD: 0.0349) -->
    <!-- y = 250 - 0.6708 * 200 = 115.84; height = 134.16 -->
    <!-- err_top = 250 - 141.14 = 108.86, err_bot = 250 - 127.18 = 122.82 -->
    <rect x="190" y="115.8" width="60" height="134.2" fill="#94a3b8" rx="4"/>
    <line class="error-bar" x1="220" y1="108.9" x2="220" y2="122.8"/>
    <line class="error-bar" x1="214" y1="108.9" x2="226" y2="108.9"/>
    <line class="error-bar" x1="214" y1="122.8" x2="226" y2="122.8"/>
    <text class="val-label" x="220" y="100">0.6708</text>
    <text class="bold-label" x="220" y="270">Model B</text>
    <text class="label" x="220" y="285" text-anchor="middle">Joint Rep</text>

    <!-- Bar 3: Model J (Mean: 0.6846, SD: 0.0292) -->
    <!-- y = 250 - 0.6846 * 200 = 113.08; height = 136.92 -->
    <!-- err_top = 250 - 142.76 = 107.24, err_bot = 250 - 131.08 = 118.92 -->
    <rect x="300" y="113.1" width="60" height="136.9" fill="#60a5fa" rx="4"/>
    <line class="error-bar" x1="330" y1="107.2" x2="330" y2="118.9"/>
    <line class="error-bar" x1="324" y1="107.2" x2="336" y2="107.2"/>
    <line class="error-bar" x1="324" y1="118.9" x2="336" y2="118.9"/>
    <text class="val-label" x="330" y="98">0.6846</text>
    <text class="bold-label" x="330" y="270">Model J</text>
    <text class="label" x="330" y="285" text-anchor="middle">Spatial-Gated</text>

    <!-- Bar 4: E0 (Mean: 0.6926, SD: 0.0402) -->
    <!-- y = 250 - 0.6926 * 200 = 111.48; height = 138.52 -->
    <!-- err_top = 250 - 146.56 = 103.44, err_bot = 250 - 130.48 = 119.52 -->
    <rect x="410" y="111.5" width="60" height="138.5" fill="#818cf8" rx="4"/>
    <line class="error-bar" x1="440" y1="103.4" x2="440" y2="119.5"/>
    <line class="error-bar" x1="434" y1="103.4" x2="446" y2="103.4"/>
    <line class="error-bar" x1="434" y1="119.5" x2="446" y2="119.5"/>
    <text class="val-label" x="440" y="94">0.6926</text>
    <text class="bold-label" x="440" y="270">E0</text>
    <text class="label" x="440" y="285" text-anchor="middle">A + B</text>

    <!-- Bar 5: E_J (Mean: 0.6939, SD: 0.0377) -->
    <!-- y = 250 - 0.6939 * 200 = 111.22; height = 138.78 -->
    <!-- err_top = 250 - 146.32 = 103.68, err_bot = 250 - 131.24 = 118.76 -->
    <rect x="520" y="111.2" width="60" height="138.8" fill="#3b82f6" rx="4" stroke="#1d4ed8" stroke-width="1.5"/>
    <line class="error-bar" x1="550" y1="103.7" x2="550" y2="118.8"/>
    <line class="error-bar" x1="544" y1="103.7" x2="556" y2="103.7"/>
    <line class="error-bar" x1="544" y1="118.8" x2="556" y2="118.8"/>
    <text class="val-label" x="550" y="94" fill="#1d4ed8">0.6939</text>
    <text class="bold-label" x="550" y="270" fill="#1d4ed8">E_J</text>
    <text class="label" x="550" y="285" text-anchor="middle" font-weight="600" fill="#1d4ed8">Locked Final</text>
  </g>
</svg>
