<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="100%" height="100%">
  <defs>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #475569; }
      .bold-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
      .val-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
      .panel-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .grid { stroke: #e2e8f0; stroke-width: 1; stroke-dasharray: 2,2; }
      .axis { stroke: #94a3b8; stroke-width: 1.2; }
    </style>
  </defs>

  <!-- Background container -->
  <rect width="860" height="320" fill="#ffffff" rx="8" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ================= PANEL A: Tracking Accuracy (HOTA / IDF1) ================= -->
  <g transform="translate(30, 20)">
    <text class="panel-title" x="0" y="15">Panel A: Tracking Accuracy (12 Held-Out Videos)</text>

    <!-- Y-axis grid (80% to 100%) -->
    <!-- 100% -> y=50, 95% -> y=95, 90% -> y=140, 85% -> y=185, 80% -> y=230 -->
    <line class="grid" x1="45" y1="50" x2="380" y2="50"/>
    <text class="label" x="40" y="54" text-anchor="end">100%</text>

    <line class="grid" x1="45" y1="95" x2="380" y2="95"/>
    <text class="label" x="40" y="99" text-anchor="end">95%</text>

    <line class="grid" x1="45" y1="140" x2="380" y2="140"/>
    <text class="label" x="40" y="144" text-anchor="end">90%</text>

    <line class="grid" x1="45" y1="185" x2="380" y2="185"/>
    <text class="label" x="40" y="189" text-anchor="end">85%</text>

    <line class="axis" x1="45" y1="230" x2="380" y2="230"/>
    <text class="label" x="40" y="234" text-anchor="end">80%</text>
    <line class="axis" x1="45" y1="50" x2="45" y2="230"/>

    <!-- Legend -->
    <rect x="250" y="10" width="12" height="10" fill="#3b82f6" rx="2"/>
    <text class="label" x="266" y="19">HOTA</text>
    <rect x="315" y="10" width="12" height="10" fill="#6366f1" rx="2"/>
    <text class="label" x="331" y="19">IDF1</text>

    <!-- Group 1: Raw ByteTrack -->
    <!-- HOTA 89.41% -> (89.41-80)/20 * 180 = 84.69 px height -> y = 230 - 84.69 = 145.31 -->
    <rect x="80" y="145.3" width="30" height="84.7" fill="#93c5fd" rx="3"/>
    <text class="val-label" x="95" y="138">89.41%</text>
    <!-- IDF1 94.23% -> (94.23-80)/20 * 180 = 128.07 px height -> y = 230 - 128.07 = 101.93 -->
    <rect x="115" y="101.9" width="30" height="128.1" fill="#a5b4fc" rx="3"/>
    <text class="val-label" x="130" y="94">94.23%</text>
    <text class="bold-label" x="112" y="250">Raw</text>

    <!-- Group 2: RealTime-Fast -->
    <!-- HOTA 90.33% -> (90.33-80)/20 * 180 = 92.97 px height -> y = 230 - 92.97 = 137.03 -->
    <rect x="180" y="137.0" width="30" height="93.0" fill="#3b82f6" rx="3"/>
    <text class="val-label" x="195" y="130">90.33%</text>
    <!-- IDF1 95.03% -> (95.03-80)/20 * 180 = 135.27 px height -> y = 230 - 135.27 = 94.73 -->
    <rect x="215" y="94.7" width="30" height="135.3" fill="#6366f1" rx="3"/>
    <text class="val-label" x="230" y="87">95.03%</text>
    <text class="bold-label" x="212" y="250">RealTime</text>

    <!-- Group 3: Hybrid-ByteTrack -->
    <!-- HOTA 93.55% -> (93.55-80)/20 * 180 = 121.95 px height -> y = 230 - 121.95 = 108.05 -->
    <rect x="280" y="108.1" width="30" height="121.9" fill="#0284c7" rx="3"/>
    <text class="val-label" x="295" y="101">93.55%</text>
    <!-- IDF1 98.41% -> (98.41-80)/20 * 180 = 165.69 px height -> y = 230 - 165.69 = 64.31 -->
    <rect x="315" y="64.3" width="30" height="165.7" fill="#4338ca" rx="3"/>
    <text class="val-label" x="330" y="57">98.41%</text>
    <text class="bold-label" x="312" y="250">Hybrid</text>
  </g>

  <!-- Divider -->
  <line x1="435" y1="20" x2="435" y2="290" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ================= PANEL B: Identity Switches (IDSW) ================= -->
  <g transform="translate(465, 20)">
    <text class="panel-title" x="0" y="15">Panel B: Identity Switches (Lower is Better)</text>

    <!-- Y-axis grid (0 to 70) -->
    <!-- 70 -> y=50, 50 -> y=101.4, 30 -> y=152.9, 10 -> y=204.3, 0 -> y=230 (range 180px) -->
    <line class="grid" x1="40" y1="50" x2="350" y2="50"/>
    <text class="label" x="35" y="54" text-anchor="end">70</text>

    <line class="grid" x1="40" y1="101.4" x2="350" y2="101.4"/>
    <text class="label" x="35" y="105.4" text-anchor="end">50</text>

    <line class="grid" x1="40" y1="152.9" x2="350" y2="152.9"/>
    <text class="label" x="35" y="156.9" text-anchor="end">30</text>

    <line class="grid" x1="40" y1="204.3" x2="350" y2="204.3"/>
    <text class="label" x="35" y="208.3" text-anchor="end">10</text>

    <line class="axis" x1="40" y1="230" x2="350" y2="230"/>
    <text class="label" x="35" y="234" text-anchor="end">0</text>
    <line class="axis" x1="40" y1="50" x2="40" y2="230"/>

    <!-- Bar 1: Raw (64 IDSW) -> 64/70 * 180 = 164.57 px -> y = 230 - 164.57 = 65.43 -->
    <rect x="75" y="65.4" width="50" height="164.6" fill="#f87171" rx="4"/>
    <text class="val-label" x="100" y="55">64</text>
    <text class="bold-label" x="100" y="250">Raw</text>

    <!-- Bar 2: RealTime-Fast (39 IDSW) -> 39/70 * 180 = 100.29 px -> y = 230 - 100.29 = 129.71 -->
    <rect x="170" y="129.7" width="50" height="100.3" fill="#fbbf24" rx="4"/>
    <text class="val-label" x="195" y="120">39</text>
    <text class="bold-label" x="195" y="250">RealTime</text>
    <text class="label" x="195" y="265" text-anchor="middle" fill="#d97706">-39.1%</text>

    <!-- Bar 3: Hybrid-ByteTrack (8 IDSW) -> 8/70 * 180 = 20.57 px -> y = 230 - 20.57 = 209.43 -->
    <rect x="265" y="209.4" width="50" height="20.6" fill="#34d399" rx="4"/>
    <text class="val-label" x="290" y="200" fill="#047857">8</text>
    <text class="bold-label" x="290" y="250">Hybrid</text>
    <text class="label" x="290" y="265" text-anchor="middle" fill="#059669">-87.5%</text>
  </g>
</svg>
