policy:
  no_overwrite: true
  candidate_class: SCIENTIFIC_CANDIDATE
  manifest_transaction: committed_candidate_only
  resume_requires_matching_manifest: true
  rollback: quarantine_failed_candidate
  automatic_promotion: false
  automatic_downstream_execution: false

authorization:
